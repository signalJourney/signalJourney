name: Publish to PyPI

# Runs when a version tag is pushed. Publishing uses PyPI trusted publishing
# (OpenID Connect), so no token or password secret is stored in this repository.
# One-time setup by a maintainer: register this workflow (publish.yml) and the
# environment name "pypi" as a trusted publisher of the PyPI project named
# "signalJourney" (normalized "signaljourney"), and
# create the "pypi" environment in the repository settings.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to check that the tag is on main
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false # no cache restored into a release build

      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not reachable from main" >&2
            exit 1
          fi

      - name: Check that the tag, pyproject.toml and __version__ agree
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as f:
              pyproject = tomllib.load(f)["project"]["version"]
          with open("src/signaljourney_validator/__init__.py", encoding="utf-8") as f:
              module = re.search(r'^__version__ = "([^"]+)"', f.read(), re.M).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if not (tag == f"v{pyproject}" and pyproject == module):
              raise SystemExit(
                  f"Mismatch: tag {tag}, pyproject.toml {pyproject}, __version__ {module}"
              )
          PY

      - name: Build the sdist and the wheel
        run: uv build

      - name: Check the installed wheel against the checkout, outside the checkout
        run: |
          wheel="$(ls "$PWD"/dist/*.whl)"
          expected="$(( $(find "$PWD/src/signaljourney_validator/schema" -name '*.json' | wc -l) ))"
          cd "$RUNNER_TEMP"
          installed="$(uv run --isolated --no-project --with "$wheel" python -c "import importlib.resources as r, pathlib; print(sum(1 for _ in pathlib.Path(str(r.files('signaljourney_validator') / 'schema')).rglob('*.json')))")"
          echo "schema files: ${installed} installed, ${expected} in the checkout"
          if [ "${expected}" -eq 0 ] || [ "${installed}" -ne "${expected}" ]; then
            echo "The wheel does not carry every schema file" >&2
            exit 1
          fi
          example="$(uv run --isolated --no-project --with "$wheel" python -c "import importlib.resources as r; print(r.files('signaljourney_validator') / 'schema/examples/simple_pipeline.json')")"
          uv run --isolated --no-project --with "$wheel" signaljourney-validate validate "$example"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/signaljourney
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
