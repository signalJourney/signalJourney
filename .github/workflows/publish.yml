name: Publish to PyPI

# Runs when a version tag is pushed. Publishing uses PyPI trusted publishing
# (OpenID Connect), so no token or password secret is stored in this repository.
# One-time setup by a maintainer: register this workflow (publish.yml) and the
# environment name "pypi" as a trusted publisher of the project on PyPI, and
# create the "pypi" environment in the repository settings.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check that the tag matches the package version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the package version v${version} in pyproject.toml" >&2
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: uv build

      - name: Validate an example from the installed wheel, outside the checkout
        run: |
          wheel="$(ls "$PWD"/dist/*.whl)"
          cd "$RUNNER_TEMP"
          example="$(uv run --isolated --no-project --with "$wheel" python -c "import importlib.resources as r; print(r.files('signaljourney_validator') / 'schema/examples/simple_pipeline.json')")"
          uv run --isolated --no-project --with "$wheel" signaljourney-validate validate "$example"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/signaljourney-validator
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
