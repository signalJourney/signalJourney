name: Publish

# Runs when a version tag is pushed. The chain is: check the tag, build, publish to
# TestPyPI, install from TestPyPI in a fresh environment, publish to PyPI, create
# the GitHub release titled exactly with the tag. A tag that fails any step
# publishes nothing after that step (docs/RELEASING.md has the recovery steps).
#
# Publishing uses trusted publishing (OpenID Connect), so no token or password
# secret is stored in this repository. One-time setup by a maintainer: register
# this workflow (publish.yml) as a trusted publisher of the project "signalJourney"
# (normalized "signaljourney") on PyPI with the environment name "pypi", and on
# TestPyPI with the environment name "testpypi", and create both environments in
# the repository settings.

on:
  push:
    tags:
      - "v*" # anything that is not exactly vX.Y.Z is refused by the check job

permissions:
  contents: read

# One run per tag at a time, and a running release is never cancelled half way.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to check that the tag is on main
          persist-credentials: false

      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not reachable from main" >&2
            exit 1
          fi

      - name: Check the tag against the version and the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_check.py tag "$TAG"

  build:
    name: Build and smoke-test the distributions
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4" # the uv that builds a release is pinned
          enable-cache: false # no cache restored into a release build

      - name: Build the sdist and the wheel
        run: uv build

      - name: Check the built distributions against the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release_check.py tag "$TAG" --dist dist/

      - name: Check the installed wheel against the checkout, outside the checkout
        run: |
          wheel="$(ls "$PWD"/dist/*.whl)"
          expected="$(( $(find "$PWD/src/signaljourney_validator/schema" -name '*.json' | wc -l) ))"
          cd "$RUNNER_TEMP"
          installed="$(uv run --isolated --no-project --with "$wheel" python -c "import importlib.resources as r, pathlib; print(sum(1 for _ in pathlib.Path(str(r.files('signaljourney_validator') / 'schema')).rglob('*.json')))")"
          echo "schema files: ${installed} installed, ${expected} in the checkout"
          if [ "${expected}" -eq 0 ] || [ "${installed}" -ne "${expected}" ]; then
            echo "The wheel does not carry every schema file" >&2
            exit 1
          fi
          example="$(uv run --isolated --no-project --with "$wheel" python -c "import importlib.resources as r; print(r.files('signaljourney_validator') / 'schema/examples/simple_pipeline.json')")"
          uv run --isolated --no-project --with "$wheel" signaljourney-validate validate "$example"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # The smoke job has no checkout, so it takes the checked script from here.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-check
          path: scripts/release_check.py
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/signaljourney
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # a re-run after a later failure must not fail on files already uploaded

  smoke-testpypi:
    name: Install from TestPyPI in a fresh environment
    needs: testpypi
    runs-on: ubuntu-24.04
    permissions: {} # nothing here reads or writes the repository
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-check
          path: release-check/

      # Builds are not reproducible and TestPyPI keeps the first upload of a file
      # (skip-existing), so a re-run could install old bytes while PyPI receives new
      # ones. Every file in dist/ must therefore have the sha256 that TestPyPI holds;
      # a difference fails the run at once (bump the version, never re-tag). Only a
      # file that is not listed yet, as the index catches up, is retried.
      # There is no checkout: the check runs against the installed package only.
      # Only signalJourney itself comes from TestPyPI (--no-deps); its dependencies,
      # taken from the package's own Requires-Dist, come from PyPI, so a name squatted
      # on TestPyPI can never be installed.
      - name: Compare digests, install and run the packaged example
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          venv="${RUNNER_TEMP}/smoke"
          reqs="${RUNNER_TEMP}/requires.txt"
          json="${RUNNER_TEMP}/testpypi.json"
          url="https://test.pypi.org/pypi/signaljourney/${version}/json"
          uv venv "$venv"
          python="${venv}/bin/python"

          install_and_validate() {
            uv pip install --python "$python" --refresh --no-deps \
              --index-url https://test.pypi.org/simple/ "signalJourney==${version}" \
            && "$python" -c "import importlib.metadata as m; print('\n'.join(r for r in (m.requires('signalJourney') or []) if 'extra ==' not in r))" > "$reqs" \
            && uv pip install --python "$python" --requirement "$reqs" \
            && uv pip check --python "$python" \
            && "$python" -c "import signaljourney_validator as m, sys; sys.exit(0 if m.__version__ == sys.argv[1] else 1)" "$version" \
            && example="$("$python" -c "import importlib.resources as r; print(r.files('signaljourney_validator') / 'schema/examples/simple_pipeline.json')")" \
            && "${venv}/bin/signaljourney-validate" validate "$example"
          }

          for attempt in 1 2 3 4 5; do
            echo "attempt ${attempt} of 5"
            status=0
            curl -fsSL --max-time 30 --output "$json" "$url" || status=3
            if [ "$status" -eq 0 ]; then
              python3 release-check/release_check.py digests --dist dist/ --json "$json" || status=$?
            fi
            if [ "$status" -eq 1 ]; then
              echo "TestPyPI holds other bytes than this run built; bump the version, never re-tag" >&2
              exit 1
            fi
            if [ "$status" -eq 0 ] && install_and_validate; then
              echo "the TestPyPI release of ${version} matches the build, installs and validates"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 30 # the index may not list the new files yet
            fi
          done
          echo "signalJourney ${version} did not verify from TestPyPI" >&2
          exit 1

  pypi:
    name: Publish to PyPI
    needs: smoke-testpypi
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/signaljourney
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    name: Create the GitHub release
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the only job that writes to the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The title is exactly the tag. A re-run finds the release and rewrites it.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release_check.py notes "${TAG#v}" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
