name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

# Runners are pinned to ubuntu-24.04: ubuntu-latest moved to a release that has no
# Python 3.9 build. Python comes from astral-sh/setup-uv and packages are installed
# with uv, never pip. Tools that CI runs without installing them into the project
# (ruff, bandit, pip-audit) are pinned to an exact version.

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Test on relevant Python versions
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Lint with Ruff
      run: |
        uvx ruff@0.17.5 check src tests scripts
        uvx ruff@0.17.5 format --check src tests scripts

    - name: Test with pytest
      run: |
        uv run --extra test pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@e0b68c6749509c5f83f984dd99a76a1c1a231044 # v4.0.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  release-rules:
    name: Release Rules
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: '3.9' # the oldest Python the project supports

    - name: Check the version, changelog and packaging rules
      run: uv run --no-project python scripts/release_check.py static

    - name: Test the release checks
      run: uv run --with pytest --with pytest-cov pytest tests/test_release_check.py -q

  validate-examples:
    name: Validate Examples
    runs-on: ubuntu-24.04
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.11
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.11"

    - name: Validate all example files
      run: |
        echo "Validating all signalJourney example files..."

        # Find all example JSON files
        find src/signaljourney_validator/schema/examples/ -name "*.json" -type f | while read -r file; do
          echo "Validating: $file"
          if uv run signaljourney-validate validate "$file"; then
            echo "$file passed validation"
          else
            echo "$file failed validation"
            exit 1
          fi
        done

        echo "All example files are valid."

    - name: Validate schema consistency
      run: |
        echo "Checking schema file consistency..."

        # Validate all schema files are valid JSON
        find src/signaljourney_validator/schema/ -name "*.schema.json" -type f | while read -r file; do
          echo "Checking JSON validity: $file"
          if uv run python -m json.tool "$file" > /dev/null; then
            echo "$file is valid JSON"
          else
            echo "$file contains invalid JSON"
            exit 1
          fi
        done

        echo "All schema files are valid JSON."

  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.11
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.11"

    - name: Run bandit security linter
      run: |
        uvx bandit@1.9.4 -r src/ -f json -o bandit-report.json || true
        uvx bandit@1.9.4 -r src/ -ll

    # safety check is deprecated and its replacement needs an account, so the
    # dependencies are audited with pip-audit, which reads the public PyPI advisory
    # database without one. The requirements are resolved for the oldest supported
    # Python, because that resolution pins the oldest releases users can install.
    - name: Check dependencies for known vulnerabilities
      run: |
        uv pip compile pyproject.toml --python-version 3.9 --output-file audit-requirements.txt
        uvx pip-audit@2.10.1 --requirement audit-requirements.txt --no-deps --disable-pip --format json --output pip-audit-report.json || true
        uvx pip-audit@2.10.1 --requirement audit-requirements.txt --no-deps --disable-pip

    - name: Upload security reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          pip-audit-report.json

  # Placeholder Job for MATLAB tests (requires self-hosted runner or MATLAB license setup)
  # matlab-tests:
